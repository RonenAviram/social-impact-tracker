<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>קווים אדומים | הזנת נתוני תוכן</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
--blue-50:#E6F1FB;--blue-100:#B5D4F4;--blue-200:#85B7EB;--blue-400:#378ADD;--blue-600:#185FA5;--blue-800:#0C447C;--blue-900:#042C53;
--teal-50:#E1F5EE;--teal-100:#9FE1CB;--teal-200:#5DCAA5;--teal-400:#1D9E75;--teal-600:#0F6E56;--teal-800:#085041;
--gray-50:#F8F9FA;--gray-100:#F1F3F5;--gray-200:#E9ECEF;--gray-300:#DEE2E6;--gray-400:#ADB5BD;--gray-500:#868E96;--gray-600:#495057;--gray-700:#343A40;--gray-800:#212529;
--green-50:#EAF3DE;--green-400:#639922;
--red-50:#FCEBEB;--red-400:#E24B4A;
--radius:12px;--radius-sm:8px;
}
body{font-family:'Segoe UI',Tahoma,Arial,sans-serif;background:var(--gray-50);color:var(--gray-800);min-height:100vh;direction:rtl}
:focus-visible{outline:2px solid var(--blue-400);outline-offset:2px;border-radius:4px}
.container{max-width:600px;margin:0 auto;padding:24px 16px 60px}

.header{text-align:center;margin-bottom:28px}
.logo{width:64px;height:64px;border-radius:50%;background:linear-gradient(135deg,var(--blue-400),var(--teal-400));display:inline-flex;align-items:center;justify-content:center;margin-bottom:12px}
.logo svg{width:32px;height:32px;fill:#fff}
.header h1{font-size:22px;font-weight:600;color:var(--blue-900);margin-bottom:4px}
.campaign-badge{padding:6px 16px;border-radius:20px;border:1.5px solid var(--teal-200);font-size:14px;font-weight:500;color:var(--teal-800);background:var(--teal-50);display:inline-block;margin-top:4px}

.screen{display:none;animation:fadeIn .3s ease}
.screen.active{display:block}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

/* Login */
.login-card{background:#fff;border-radius:var(--radius);border:1px solid var(--gray-200);padding:24px 20px}
.login-title{font-size:17px;font-weight:600;color:var(--blue-800);margin-bottom:16px}
.field{margin-bottom:14px}
.field label{display:block;font-size:12px;font-weight:500;color:var(--gray-500);margin-bottom:5px}
.field select,.field input{width:100%;padding:10px 12px;border:1.5px solid var(--gray-200);border-radius:var(--radius-sm);font-size:14px;font-family:inherit;background:#fff;color:var(--gray-800);transition:border-color .2s}
.field select:focus,.field input:focus{outline:none;border-color:var(--blue-400);box-shadow:0 0 0 3px rgba(55,138,221,.12)}

/* Buttons */
.btn{padding:12px 24px;border:none;border-radius:var(--radius-sm);font-size:15px;font-weight:600;cursor:pointer;transition:all .2s;font-family:inherit}
.btn-primary{background:var(--blue-400);color:#fff}
.btn-primary:hover{background:var(--blue-600)}
.btn-primary:disabled{background:var(--gray-300);color:var(--gray-400);cursor:not-allowed}
.btn-secondary{background:transparent;color:var(--blue-600);border:1.5px solid var(--blue-200)}
.btn-secondary:hover{background:var(--blue-50)}
.btn-danger{background:transparent;color:var(--red-400);border:1.5px solid var(--gray-200)}
.btn-danger:hover{background:var(--red-50);border-color:var(--red-400)}
.btn-full{width:100%}
.btn-row{display:flex;gap:8px;margin-top:20px}
.btn-row .btn{flex:1}

/* User bar */
.user-bar{display:flex;align-items:center;gap:10px;margin-bottom:20px;padding:12px 16px;background:#fff;border-radius:var(--radius);border:1px solid var(--gray-200)}
.user-avatar{width:36px;height:36px;border-radius:50%;background:var(--blue-400);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:600;font-size:14px;flex-shrink:0}
.user-bar .user-name{font-size:14px;font-weight:500;color:var(--gray-700)}
.user-bar .user-org{font-size:12px;color:var(--gray-400)}
.user-bar .btn-logout{margin-right:auto;font-size:12px;color:var(--gray-400);background:none;border:none;cursor:pointer;font-family:inherit;padding:4px 8px;border-radius:4px}
.user-bar .btn-logout:hover{background:var(--gray-100);color:var(--gray-600)}

/* Personal area */
.area-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.area-title{font-size:17px;font-weight:600;color:var(--blue-800)}
.add-btn{display:flex;align-items:center;gap:5px;padding:8px 16px;border-radius:var(--radius-sm);border:none;background:var(--blue-400);color:#fff;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;transition:all .2s}
.add-btn:hover{background:var(--blue-600)}

.content-card{background:#fff;border-radius:var(--radius);border:1px solid var(--gray-200);padding:16px;margin-bottom:12px;transition:border-color .15s}
.content-card:hover{border-color:var(--blue-200)}
.cc-top{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.cc-icon{font-size:22px}
.cc-title{font-size:15px;font-weight:600;color:var(--blue-800);flex:1}
.cc-type{font-size:11px;color:var(--blue-600);background:var(--blue-50);padding:3px 10px;border-radius:12px}
.cc-link{font-size:12px;color:var(--blue-600);text-decoration:none;display:block;margin-bottom:6px;direction:ltr;text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cc-link:hover{text-decoration:underline}
.cc-dates{font-size:11px;color:var(--gray-400);margin-bottom:10px}
.cc-metrics{display:grid;grid-template-columns:repeat(auto-fill,minmax(80px,1fr));gap:6px;margin-bottom:10px}
.cc-metric{text-align:center;background:var(--gray-50);border-radius:6px;padding:8px 4px}
.cc-metric .val{font-size:16px;font-weight:600;color:var(--blue-800)}
.cc-metric .lbl{font-size:10px;color:var(--gray-500)}
.cc-actions{display:flex;gap:8px}
.cc-actions .btn{flex:1;padding:8px;font-size:13px}

.empty-state{text-align:center;padding:40px 20px;background:#fff;border-radius:var(--radius);border:1px solid var(--gray-200)}
.empty-icon{font-size:48px;margin-bottom:12px;display:block}
.empty-state h3{font-size:17px;color:var(--blue-800);margin-bottom:8px}
.empty-state p{font-size:14px;color:var(--gray-500);margin-bottom:20px}

/* Upload form */
.form-card{background:#fff;border-radius:var(--radius);border:1px solid var(--gray-200);padding:20px}
.form-title{font-size:17px;font-weight:600;color:var(--blue-800);margin-bottom:16px}

.platform-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}
@media(max-width:420px){.platform-grid{grid-template-columns:repeat(2,1fr)}}
.platform-card{border:2px solid var(--gray-200);border-radius:var(--radius);padding:14px 10px;text-align:center;cursor:pointer;transition:all .2s;background:#fff;position:relative}
.platform-card:hover{border-color:var(--blue-200);background:var(--blue-50)}
.platform-card.selected{border-color:var(--blue-400);background:var(--blue-50)}
.platform-card .icon{font-size:24px;margin-bottom:4px;display:block}
.platform-card .name{font-size:12px;font-weight:500;color:var(--gray-700)}
.platform-card .check{position:absolute;top:6px;left:6px;width:20px;height:20px;border-radius:50%;border:2px solid var(--gray-300);display:flex;align-items:center;justify-content:center;transition:all .2s}
.platform-card.selected .check{background:var(--blue-400);border-color:var(--blue-400)}
.platform-card.selected .check::after{content:'✓';color:#fff;font-size:12px;font-weight:700}

.type-pills{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.type-pill{border:1.5px solid var(--gray-200);border-radius:20px;padding:5px 14px;font-size:12px;cursor:pointer;transition:all .2s;background:#fff;color:var(--gray-600)}
.type-pill:hover{border-color:var(--blue-200)}
.type-pill.selected{border-color:var(--blue-400);background:var(--blue-50);color:var(--blue-800);font-weight:500}

.link-field input{direction:ltr;text-align:left}

.note{font-size:12px;color:var(--gray-400);text-align:center;margin-top:12px}

/* Update form */
.update-header{display:flex;align-items:center;gap:10px;margin-bottom:16px;padding-bottom:12px;border-bottom:1px solid var(--gray-100)}
.update-icon{font-size:28px}
.update-info h3{font-size:16px;font-weight:600;color:var(--blue-800)}
.update-info p{font-size:12px;color:var(--gray-400)}
.metrics-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
@media(max-width:420px){.metrics-grid{grid-template-columns:1fr}}
.metric-field label{display:block;font-size:12px;font-weight:500;color:var(--gray-500);margin-bottom:3px}
.metric-field label .req{color:var(--red-400)}
.metric-field input{width:100%;padding:9px 10px;border:1.5px solid var(--gray-200);border-radius:6px;font-size:14px;font-family:inherit;background:#fff;color:var(--gray-800);transition:border-color .2s;direction:ltr;text-align:right}
.metric-field input:focus{outline:none;border-color:var(--blue-400);box-shadow:0 0 0 3px rgba(55,138,221,.12)}
.required-note{font-size:12px;color:var(--gray-500);background:var(--gray-50);padding:8px 12px;border-radius:var(--radius-sm);margin-bottom:14px}
.date-row{display:flex;align-items:center;gap:10px;margin-bottom:4px}
.date-row label{font-size:12px;color:var(--gray-500);white-space:nowrap}
.date-row input{flex:1;padding:8px 10px;border:1.5px solid var(--gray-200);border-radius:6px;font-size:13px;font-family:inherit}

/* Confirm dialog */
.confirm-overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;z-index:100;display:none}
.confirm-overlay.show{display:flex}
.confirm-box{background:#fff;border-radius:var(--radius);padding:24px;max-width:320px;width:90%;text-align:center}
.confirm-box h3{font-size:16px;color:var(--gray-800);margin-bottom:8px}
.confirm-box p{font-size:13px;color:var(--gray-500);margin-bottom:20px}

/* Success */
.success-screen{text-align:center;padding:40px 20px}
.success-icon{width:80px;height:80px;border-radius:50%;background:var(--teal-50);display:inline-flex;align-items:center;justify-content:center;margin-bottom:16px;animation:popIn .4s ease}
.success-icon svg{width:40px;height:40px;stroke:var(--teal-400);fill:none;stroke-width:2.5}
@keyframes popIn{0%{transform:scale(0)}50%{transform:scale(1.15)}100%{transform:scale(1)}}
.success-screen h2{font-size:20px;color:var(--teal-800);margin-bottom:8px}
.success-screen p{font-size:14px;color:var(--gray-500);margin-bottom:20px;line-height:1.6}

.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--gray-800);color:#fff;padding:10px 20px;border-radius:20px;font-size:13px;opacity:0;transition:all .4s;z-index:100;white-space:nowrap}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1}

.skip-link{display:block;text-align:center;margin-top:16px;font-size:13px;color:var(--gray-400);text-decoration:none;transition:color .2s}
.skip-link:hover{color:var(--blue-600)}

/* Mobile enhancements */
@media(max-width:420px){
  .container{padding:16px 10px 40px}
  .header h1{font-size:19px}
  .campaign-badge{font-size:12px;padding:5px 12px}
  .btn{padding:10px 18px;font-size:14px}
  .cc-metrics{grid-template-columns:repeat(2,1fr)}
  .content-card{padding:12px}
}
.loading-overlay{position:fixed;inset:0;background:rgba(255,255,255,.85);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:200}
.loading-overlay.hidden{display:none}
.spinner{width:36px;height:36px;border:3px solid var(--gray-200);border-top-color:var(--blue-400);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-text{margin-top:12px;font-size:14px;color:var(--gray-500)}
</style>
</head>
<body>
<div class="loading-overlay" id="loadingOverlay" role="status" aria-label="טוען"><div class="spinner"></div><div class="loading-text">טוען...</div></div>
<div class="container">

  <div class="header">
    <div class="logo" style="background:none"><img src="logo.jpg" alt="קווים אדומים" style="width:64px;height:64px;object-fit:contain" onerror="this.parentNode.style.background='linear-gradient(135deg,var(--blue-400),var(--teal-400))'"></div>
    <h1>קווים אדומים</h1>
    <div class="campaign-badge" id="campaignName">מניעת אלימות בזוגיות צעירה</div>
  </div>

  <!-- Screen 1: Login -->
  <div class="screen active" id="screenLogin">
    <div class="login-card">
      <div class="login-title">כניסה למערכת</div>
      <div class="field">
        <label>שם מלא</label>
        <select id="loginName" onchange="onNameChange()" aria-label="בחירת שם">
          <option value="">בחירת שם...</option>
        </select>
      </div>
      <div class="field">
        <label>ארגון</label>
        <select id="loginOrg" onchange="checkLoginReady()" aria-label="בחירת ארגון">
          <option value="">בחירת ארגון...</option>
        </select>
      </div>
      <button class="btn btn-primary btn-full" id="btnLogin" disabled onclick="doLogin()">כניסה</button>
      <a class="skip-link" onclick="window.open('dashboard.html?campaign=' + activeCampaignId,'_blank')">צפייה בדשבורד ←</a>
    </div>
  </div>

  <!-- Screen 2: Personal area -->
  <div class="screen" id="screenPersonal">
    <div class="user-bar" id="userBar">
      <div class="user-avatar" id="userAvatar">—</div>
      <div>
        <div class="user-name" id="userName">—</div>
        <div class="user-org" id="userOrg">—</div>
      </div>
      <button class="btn-logout" onclick="doLogout()">החלף משתמש</button>
    </div>
    <div class="area-header">
      <div class="area-title">התכנים שלי</div>
      <button class="add-btn" id="btnAddContent" onclick="showUploadScreen()">+ הוסף תוכן</button>
    </div>
    <div id="contentList"></div>
    <a class="skip-link" style="margin-top:24px;cursor:pointer" onclick="window.open('dashboard.html?campaign=' + activeCampaignId,'_blank')">צפייה בדשבורד ←</a>
  </div>

  <!-- Screen 3: Upload new content -->
  <div class="screen" id="screenUpload">
    <div class="user-bar">
      <div class="user-avatar" id="uploadAvatar">—</div>
      <div>
        <div class="user-name" id="uploadUserName">—</div>
        <div class="user-org" id="uploadUserOrg">—</div>
      </div>
    </div>
    <div class="form-card">
      <div class="form-title">העלאת תוכן חדש</div>

      <!-- Step 1: Platform selection (multi) -->
      <div id="uploadStep1">
        <div class="field"><label>בחירת פלטפורמות (ניתן לבחור כמה)</label></div>
        <div class="platform-grid" id="uploadPlatformGrid"></div>
        <button class="btn btn-primary btn-full" id="btnContinueUpload" disabled onclick="startPlatformDetails()" style="margin-top:8px">המשך</button>
      </div>

      <!-- Step 2: Per-platform details (wizard) -->
      <div id="uploadStep2" style="display:none">
        <div id="uploadStepIndicator" style="font-size:13px;color:var(--gray-500);margin-bottom:12px;text-align:center"></div>
        <div style="display:flex;align-items:center;gap:8px;margin-bottom:14px;padding:10px;background:var(--blue-50);border-radius:var(--radius-sm)">
          <span id="uploadPlatIcon" style="font-size:24px"></span>
          <span id="uploadPlatName" style="font-size:15px;font-weight:600;color:var(--blue-800)"></span>
        </div>
        <div class="field" id="uploadTypeField">
          <label>סוג תוכן</label>
          <div class="type-pills" id="uploadTypePills"></div>
        </div>
        <div class="field link-field">
          <label>קישור לתוכן <span style="color:var(--red-400)">*</span></label>
          <input type="url" id="uploadLink" placeholder="הדביקו קישור מלא, למשל https://facebook.com/...">
          <div id="linkHint" style="font-size:11px;color:var(--gray-400);margin-top:4px">יש להזין קישור מלא שמתחיל ב-https://</div>
        </div>
        <div class="field">
          <label>תאריך העלאה</label>
          <input type="date" id="uploadDate">
        </div>
        <div class="btn-row">
          <button class="btn btn-primary" id="btnNextPlatform" onclick="nextPlatformStep()">הבא</button>
          <button class="btn btn-secondary" id="btnPrevPlatform" onclick="prevPlatformStep()" style="display:none">הקודם</button>
        </div>
      </div>

      <button class="btn btn-secondary btn-full" style="margin-top:12px" onclick="backFromUpload()">חזרה</button>
    </div>
  </div>

  <!-- Screen 4: Update metrics -->
  <div class="screen" id="screenUpdate">
    <div class="user-bar">
      <div class="user-avatar" id="updateAvatar">—</div>
      <div>
        <div class="user-name" id="updateUserName">—</div>
        <div class="user-org" id="updateUserOrg">—</div>
      </div>
    </div>
    <div class="form-card">
      <div class="update-header" id="updateHeader"></div>
      <div class="required-note">כל השדות חובה — אם לא רלוונטי הזן 0</div>
      <div class="metrics-grid" id="updateMetrics"></div>
      <div class="date-row">
        <label>תאריך עדכון</label>
        <input type="date" id="updateDate">
      </div>
      <div class="btn-row">
        <button class="btn btn-primary" id="btnSaveUpdate" onclick="saveUpdate()">שמור עדכון</button>
        <button class="btn btn-secondary" onclick="showScreen('screenPersonal')">חזרה</button>
      </div>
    </div>
  </div>

  <!-- Screen 5: Success -->
  <div class="screen" id="screenSuccess">
    <div class="success-screen">
      <div class="success-icon"><svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg></div>
      <h2 id="successTitle">הנתונים נשמרו בהצלחה!</h2>
      <p id="successMsg">התכנים שלך עודכנו.</p>
      <button class="btn btn-primary btn-full" onclick="showScreen('screenPersonal')">מעבר לאזור האישי</button>
      <button class="btn btn-secondary btn-full" style="margin-top:8px" onclick="window.open('dashboard.html?campaign=' + activeCampaignId,'_blank')">צפייה בדשבורד</button>
    </div>
  </div>

</div>

<!-- Confirm dialog -->
<div class="confirm-overlay" id="confirmOverlay">
  <div class="confirm-box">
    <h3>מחיקת תוכן</h3>
    <p id="confirmMsg">בטוח שברצונך למחוק תוכן זה?</p>
    <div class="btn-row">
      <button class="btn btn-danger" id="confirmDeleteBtn" onclick="confirmDelete()">מחק</button>
      <button class="btn btn-secondary" onclick="hideConfirm()">ביטול</button>
    </div>
  </div>
</div>

<div class="toast" id="toast" role="alert" aria-live="assertive"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script>
// =================== DATA (from config.js + Supabase) ===================
const PLATFORMS = CONFIG.PLATFORMS;

// Loaded from Supabase
let CAMPAIGN = { name: '', status: 'active' };
let POOL = []; // [{name, org, profile_id}]

// Current state
let currentUser = null; // {profileId, name, org}
let editingContentId = null;
let deletingContentId = null;
let uploadSelectedPlatforms = [];
let uploadPlatformData = {};
let currentPlatformIdx = 0;

// =================== INIT ===================
function hideLoading() { const el = document.getElementById('loadingOverlay'); if (el) el.classList.add('hidden'); }

// Resolve campaign ID from URL param or CONFIG default
function getActiveCampaignId() {
  const params = new URLSearchParams(window.location.search);
  return params.get('campaign') || CONFIG.CAMPAIGN_ID;
}
const activeCampaignId = getActiveCampaignId();

async function init() {
  const db = CONFIG.db();
  if (!db) { hideLoading(); showToast('שגיאה בחיבור למסד הנתונים'); return; }

  // If campaign changed from session, clear session so user must re-login
  const prevSession = CONFIG.getSession();
  if (prevSession && (!prevSession.campaignId || prevSession.campaignId !== activeCampaignId)) {
    CONFIG.clearSession();
  }

  // Load campaign info
  const { data: campData } = await db.rpc('get_campaign', { p_campaign_id: activeCampaignId });
  if (campData) {
    CAMPAIGN = campData;
  }

  // Note: campaign only ends when admin manually sets status to 'ended'
  // end_date is informational — admin gets a warning in the dashboard

  const badge = document.getElementById('campaignName');
  badge.textContent = CAMPAIGN.name;
  if (CAMPAIGN.status === 'ended') {
    const endStr = CAMPAIGN.end_date ? formatDate(CAMPAIGN.end_date) : '';
    badge.textContent += endStr ? ` (הסתיים ב-${endStr})` : ' (הסתיים)';
    badge.style.borderColor = '#ccc';
    badge.style.color = '#888';
    badge.style.background = '#f5f5f5';
  } else if (CAMPAIGN.status === 'paused') {
    badge.textContent += ' (מושהה)';
    badge.style.borderColor = '#f59e0b';
    badge.style.color = '#92400e';
    badge.style.background = '#fff8e1';
  }
  document.getElementById('uploadDate').value = today();

  // Load pool from Supabase
  const { data: poolData } = await db.rpc('get_campaign_pool', { p_campaign_id: activeCampaignId });
  if (poolData) {
    POOL = poolData.map(p => ({ name: p.name, org: p.org_name, profileId: p.profile_id }));
  }

  // Populate login dropdown — names only, org auto-fills
  const nameSelect = document.getElementById('loginName');
  const uniqueNames = [...new Set(POOL.map(p => p.name))];
  uniqueNames.forEach(n => { const o = document.createElement('option'); o.value = n; o.textContent = n; nameSelect.appendChild(o); });

  // Build upload platform grid (multi-select)
  const grid = document.getElementById('uploadPlatformGrid');
  PLATFORMS.forEach(p => {
    const d = document.createElement('div');
    d.className = 'platform-card'; d.dataset.id = p.id;
    d.setAttribute('role', 'checkbox'); d.setAttribute('aria-checked', 'false'); d.setAttribute('aria-label', p.name); d.tabIndex = 0;
    d.innerHTML = `<div class="check"></div><span class="icon">${p.icon}</span><span class="name">${p.name}</span>`;
    d.onclick = () => toggleUploadPlatform(p.id);
    d.onkeydown = (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggleUploadPlatform(p.id); } };
    grid.appendChild(d);
  });

  // Check if already logged in (localStorage session)
  const session = CONFIG.getSession();
  if (session && session.profileId) {
    // Verify session is still valid (profile exists in pool)
    const poolMatch = POOL.find(p => p.profileId === session.profileId);
    if (poolMatch) {
      currentUser = { profileId: session.profileId, name: session.name, org: session.orgName };
      const initials = getInitials(currentUser.name);
      ['userAvatar','uploadAvatar','updateAvatar'].forEach(id => document.getElementById(id).textContent = initials);
      ['userName','uploadUserName','updateUserName'].forEach(id => document.getElementById(id).textContent = currentUser.name);
      ['userOrg','uploadUserOrg','updateUserOrg'].forEach(id => document.getElementById(id).textContent = currentUser.org);
      showScreen('screenPersonal');
      hideLoading();
      return;
    }
  }
  hideLoading();
}

function today() { return new Date().toISOString().slice(0,10); }

function sanitizeLink(link) {
  if (!link) return '';
  const trimmed = link.trim();
  if (/^https?:\/\//i.test(trimmed)) return trimmed;
  if (/^[a-z]+:/i.test(trimmed)) return ''; // block javascript:, data:, etc.
  return trimmed; // allow relative URLs
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

function getInitials(name) {
  const parts = name.split(' ');
  return parts.length > 1 ? parts[0][0] + parts[1][0] : parts[0].substring(0,2);
}

// =================== NAVIGATION ===================
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  window.scrollTo({ top: 0, behavior: 'smooth' });
  if (id === 'screenPersonal') renderPersonalArea();
}

// =================== LOGIN ===================
function onNameChange() {
  const name = document.getElementById('loginName').value;
  const orgSelect = document.getElementById('loginOrg');

  // Find orgs for this person from pool
  const orgsForName = POOL.filter(p => p.name === name).map(p => p.org);

  // Clear and repopulate org dropdown
  orgSelect.innerHTML = '<option value="">בחירת ארגון...</option>';
  orgsForName.forEach(o => {
    const opt = document.createElement('option');
    opt.value = o; opt.textContent = o;
    orgSelect.appendChild(opt);
  });

  // Auto-select if only one org
  if (orgsForName.length === 1) {
    orgSelect.value = orgsForName[0];
    orgSelect.disabled = true;
  } else {
    orgSelect.disabled = false;
  }

  checkLoginReady();
}

function checkLoginReady() {
  const name = document.getElementById('loginName').value;
  const org = document.getElementById('loginOrg').value;
  document.getElementById('btnLogin').disabled = !name || !org;
}

async function doLogin() {
  const name = document.getElementById('loginName').value;
  const org = document.getElementById('loginOrg').value;
  if (!name || !org) return;

  const btn = document.getElementById('btnLogin');
  btn.disabled = true;
  btn.textContent = 'מתחבר...';

  // Find profile in pool (already loaded)
  const poolMatch = POOL.find(p => p.name === name && p.org === org);
  if (!poolMatch) {
    showToast('לא נמצא במאגר — פנה למנהל');
    btn.disabled = false;
    btn.textContent = 'כניסה';
    return;
  }

  currentUser = { profileId: poolMatch.profileId, name, org };
  CONFIG.setSession(poolMatch.profileId, name, org, 'member', activeCampaignId);

  // Update user bars across screens
  const initials = getInitials(name);
  ['userAvatar','uploadAvatar','updateAvatar'].forEach(id => document.getElementById(id).textContent = initials);
  ['userName','uploadUserName','updateUserName'].forEach(id => document.getElementById(id).textContent = name);
  ['userOrg','uploadUserOrg','updateUserOrg'].forEach(id => document.getElementById(id).textContent = org);

  btn.textContent = 'כניסה';
  showScreen('screenPersonal');
}

function doLogout() {
  currentUser = null;
  editingContentId = null;
  deletingContentId = null;
  uploadSelectedPlatforms = [];
  uploadPlatformData = {};
  currentPlatformIdx = 0;
  CONFIG.clearSession();
  document.getElementById('loginName').value = '';
  const orgSelect = document.getElementById('loginOrg');
  orgSelect.innerHTML = '<option value="">בחירת ארגון...</option>';
  orgSelect.disabled = false;
  document.getElementById('btnLogin').disabled = true;
  showScreen('screenLogin');
}

// =================== PERSONAL AREA ===================
async function renderPersonalArea() {
  const list = document.getElementById('contentList');
  if (!currentUser) return;

  // Show campaign status banner if not active
  let statusBanner = document.getElementById('campaignStatusBanner');
  if (!statusBanner) {
    statusBanner = document.createElement('div');
    statusBanner.id = 'campaignStatusBanner';
    statusBanner.style.cssText = 'text-align:center;padding:10px;font-size:14px;font-weight:600;border-radius:var(--radius-sm);margin-bottom:12px;display:none';
    list.parentNode.insertBefore(statusBanner, list);
  }
  const addBtn = document.getElementById('btnAddContent');
  if (CAMPAIGN.status === 'paused') {
    statusBanner.textContent = 'הקמפיין מושהה — לא ניתן להעלות תוכן חדש כרגע';
    statusBanner.style.background = '#fff8e1'; statusBanner.style.color = '#92400e'; statusBanner.style.display = 'block';
    if (addBtn) { addBtn.disabled = true; addBtn.style.opacity = '0.5'; addBtn.style.cursor = 'not-allowed'; }
  } else if (CAMPAIGN.status === 'ended') {
    statusBanner.textContent = 'הקמפיין הסתיים — לא ניתן להעלות תוכן חדש';
    statusBanner.style.background = '#f5f5f5'; statusBanner.style.color = '#888'; statusBanner.style.display = 'block';
    if (addBtn) { addBtn.disabled = true; addBtn.style.opacity = '0.5'; addBtn.style.cursor = 'not-allowed'; }
  } else {
    statusBanner.style.display = 'none';
    if (addBtn) { addBtn.disabled = false; addBtn.style.opacity = '1'; addBtn.style.cursor = 'pointer'; }
  }

  list.innerHTML = '<div style="text-align:center;padding:30px;color:var(--gray-400)">טוען...</div>';

  const db = CONFIG.db();
  const { data: contents, error } = await db.rpc('get_user_contents', {
    p_profile_id: currentUser.profileId,
    p_campaign_id: activeCampaignId
  });

  if (error) { list.innerHTML = '<div style="text-align:center;padding:30px;color:var(--red-400)">שגיאה בטעינה</div>'; return; }

  if (!contents || contents.length === 0) {
    const canAdd = CAMPAIGN.status === 'active';
    list.innerHTML = `<div class="empty-state">
      <span class="empty-icon">📋</span>
      <h3>עדיין לא העלית תכנים</h3>
      <p>${canAdd ? 'לחץ על "הוסף תוכן" כדי להתחיל' : ''}</p>
      ${canAdd ? '<button class="btn btn-primary" onclick="showUploadScreen()">+ הוסף תוכן ראשון</button>' : ''}
    </div>`;
    return;
  }

  // Store for update/delete references
  window._userContents = contents;

  let html = '';
  contents.forEach(c => {
    const plat = PLATFORMS.find(p => p.id === c.platform_id);
    if (!plat) return;
    const filteredMetrics = plat.metrics.filter(m => !m.onlyTypes || m.onlyTypes.includes(c.content_type));
    const metrics = c.latest_metrics || {};

    const safeLink = sanitizeLink(c.link);
    const displayLink = escapeHtml(c.link || '');
    html += `<div class="content-card">
      <div class="cc-top">
        <span class="cc-icon">${plat.icon}</span>
        <span class="cc-title">${plat.name}</span>
        <span class="cc-type">${c.content_type}</span>
      </div>
      ${safeLink ? `<a href="${escapeHtml(safeLink)}" class="cc-link" target="_blank" rel="noopener">${displayLink}</a>` : (c.link ? `<span class="cc-link">${displayLink}</span>` : '')}
      <div class="cc-dates">הועלה: ${formatDate(c.upload_date)}${c.latest_snapshot_date ? ' · עודכן: ' + formatDate(c.latest_snapshot_date) : ''}</div>
      <div class="cc-metrics">`;
    filteredMetrics.forEach(m => {
      const val = metrics[m.id] || 0;
      html += `<div class="cc-metric"><div class="val">${val.toLocaleString()}</div><div class="lbl">${m.label}</div></div>`;
    });
    html += `</div>
      <div class="cc-actions">
        <button class="btn btn-primary" onclick="showUpdateScreen('${c.entry_id}')">עדכן נתונים</button>
        <button class="btn btn-danger" onclick="showDeleteConfirm('${c.entry_id}')">מחק</button>
      </div>
    </div>`;
  });
  list.innerHTML = html;
}

function formatDate(d) {
  if (!d) return '';
  const parts = d.split('-');
  return `${parts[2]}.${parts[1]}.${parts[0]}`;
}

// =================== UPLOAD ===================
function showUploadScreen() {
  if (CAMPAIGN.status === 'ended' || CAMPAIGN.status === 'paused') return;
  uploadSelectedPlatforms = [];
  uploadPlatformData = {};
  currentPlatformIdx = 0;
  document.querySelectorAll('#uploadPlatformGrid .platform-card').forEach(c => c.classList.remove('selected'));
  document.getElementById('uploadStep1').style.display = 'block';
  document.getElementById('uploadStep2').style.display = 'none';
  document.getElementById('btnContinueUpload').disabled = true;
  showScreen('screenUpload');
}

function toggleUploadPlatform(platId) {
  const idx = uploadSelectedPlatforms.findIndex(p => p.id === platId);
  if (idx >= 0) {
    uploadSelectedPlatforms.splice(idx, 1);
  } else {
    uploadSelectedPlatforms.push(PLATFORMS.find(p => p.id === platId));
  }
  document.querySelectorAll('#uploadPlatformGrid .platform-card').forEach(c => {
    const sel = uploadSelectedPlatforms.some(p => p.id === c.dataset.id);
    c.classList.toggle('selected', sel);
    c.setAttribute('aria-checked', sel ? 'true' : 'false');
  });
  document.getElementById('btnContinueUpload').disabled = uploadSelectedPlatforms.length === 0;
}

function startPlatformDetails() {
  if (uploadSelectedPlatforms.length === 0) return;
  // Init data for each platform
  uploadSelectedPlatforms.forEach(p => {
    if (!uploadPlatformData[p.id]) {
      uploadPlatformData[p.id] = { type: p.types[0], link: '', date: today() };
    }
  });
  currentPlatformIdx = 0;
  document.getElementById('uploadStep1').style.display = 'none';
  document.getElementById('uploadStep2').style.display = 'block';
  renderCurrentPlatformStep();
}

function renderCurrentPlatformStep() {
  const plat = uploadSelectedPlatforms[currentPlatformIdx];
  const data = uploadPlatformData[plat.id];
  const total = uploadSelectedPlatforms.length;

  // Step indicator
  document.getElementById('uploadStepIndicator').textContent = total > 1 ? `פלטפורמה ${currentPlatformIdx + 1} מתוך ${total}` : '';

  // Platform header
  document.getElementById('uploadPlatIcon').textContent = plat.icon;
  document.getElementById('uploadPlatName').textContent = plat.name;

  // Type pills
  const pills = document.getElementById('uploadTypePills');
  pills.innerHTML = '';
  plat.types.forEach(t => {
    const pill = document.createElement('div');
    pill.className = 'type-pill' + (t === data.type ? ' selected' : '');
    pill.textContent = t;
    pill.onclick = () => {
      data.type = t;
      pills.querySelectorAll('.type-pill').forEach(p => p.classList.remove('selected'));
      pill.classList.add('selected');
      validateCurrentStep();
    };
    pills.appendChild(pill);
  });

  // Link & date
  document.getElementById('uploadLink').value = data.link;
  document.getElementById('uploadDate').value = data.date;

  // Navigation buttons
  const isLast = currentPlatformIdx === total - 1;
  document.getElementById('btnNextPlatform').textContent = isLast ? (total > 1 ? 'שמור הכל' : 'שמור') : 'הבא';
  document.getElementById('btnPrevPlatform').style.display = currentPlatformIdx > 0 ? '' : 'none';

  validateCurrentStep();
}

function isValidUrl(str) {
  return /^https?:\/\/.+/i.test(str.trim());
}

function validateCurrentStep() {
  const link = document.getElementById('uploadLink').value.trim();
  const date = document.getElementById('uploadDate').value;
  const linkInput = document.getElementById('uploadLink');
  const hint = document.getElementById('linkHint');

  if (link && !isValidUrl(link)) {
    linkInput.style.borderColor = 'var(--red-400)';
    hint.textContent = 'הקישור חייב להתחיל ב-https:// או http://';
    hint.style.color = 'var(--red-400)';
    document.getElementById('btnNextPlatform').disabled = true;
  } else if (!link) {
    linkInput.style.borderColor = '';
    hint.textContent = 'יש להזין קישור מלא שמתחיל ב-https://';
    hint.style.color = 'var(--gray-400)';
    document.getElementById('btnNextPlatform').disabled = true;
  } else {
    linkInput.style.borderColor = 'var(--teal-400)';
    hint.textContent = '✓ קישור תקין';
    hint.style.color = 'var(--teal-600)';
    document.getElementById('btnNextPlatform').disabled = !date;
  }
}

// Wire upload validation
document.getElementById('uploadLink').addEventListener('input', function() {
  const plat = uploadSelectedPlatforms[currentPlatformIdx];
  if (plat) uploadPlatformData[plat.id].link = this.value;
  validateCurrentStep();
});
document.getElementById('uploadDate').addEventListener('input', function() {
  const plat = uploadSelectedPlatforms[currentPlatformIdx];
  if (plat) uploadPlatformData[plat.id].date = this.value;
  validateCurrentStep();
});

function savePlatformStepData() {
  const plat = uploadSelectedPlatforms[currentPlatformIdx];
  uploadPlatformData[plat.id].link = document.getElementById('uploadLink').value.trim();
  uploadPlatformData[plat.id].date = document.getElementById('uploadDate').value;
}

function nextPlatformStep() {
  const link = document.getElementById('uploadLink').value.trim();
  if (!link) { showToast('נא למלא קישור לתוכן'); return; }
  if (!isValidUrl(link)) { showToast('נא להזין קישור תקין (https://...)'); return; }
  savePlatformStepData();
  const total = uploadSelectedPlatforms.length;
  if (currentPlatformIdx < total - 1) {
    currentPlatformIdx++;
    renderCurrentPlatformStep();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  } else {
    saveAllUploads();
  }
}

function prevPlatformStep() {
  savePlatformStepData();
  if (currentPlatformIdx > 0) {
    currentPlatformIdx--;
    renderCurrentPlatformStep();
  }
}

function backFromUpload() {
  if (document.getElementById('uploadStep2').style.display !== 'none' && uploadSelectedPlatforms.length > 0) {
    // Go back to platform selection
    document.getElementById('uploadStep2').style.display = 'none';
    document.getElementById('uploadStep1').style.display = 'block';
  } else {
    showScreen('screenPersonal');
  }
}

async function saveAllUploads() {
  if (!currentUser) return;
  const db = CONFIG.db();
  const btn = document.getElementById('btnNextPlatform');
  btn.disabled = true;
  btn.textContent = 'שומר...';

  const names = [];
  let errors = 0;

  for (const plat of uploadSelectedPlatforms) {
    const data = uploadPlatformData[plat.id];
    if (!data.link || !data.date) continue;
    data.link = sanitizeLink(data.link);
    if (!data.link) continue;

    const metrics = {};
    const filteredMetrics = plat.metrics.filter(m => !m.onlyTypes || m.onlyTypes.includes(data.type));
    filteredMetrics.forEach(m => { metrics[m.id] = 0; });

    const { error } = await db.rpc('add_content_entry', {
      p_profile_id: currentUser.profileId,
      p_campaign_id: activeCampaignId,
      p_platform_id: plat.id,
      p_content_type: data.type,
      p_link: data.link,
      p_upload_date: data.date,
      p_initial_metrics: metrics
    });

    if (error) { errors++; console.error('Upload error:', error); }
    else { names.push(`${plat.icon} ${plat.name}`); }
  }

  btn.textContent = uploadSelectedPlatforms.length > 1 ? 'שמור הכל' : 'שמור';
  btn.disabled = false;

  if (errors > 0 && names.length === 0) {
    showToast('שגיאה בשמירה — נסה שוב');
    return;
  }

  document.getElementById('successTitle').textContent = names.length > 1 ? `${names.length} תכנים נוספו בהצלחה!` : 'התוכן נוסף בהצלחה!';
  document.getElementById('successMsg').textContent = names.join(' · ');
  showScreen('screenSuccess');
  showToast(names.length > 1 ? `${names.length} תכנים נוספו` : 'התוכן נוסף');
}

// =================== UPDATE ===================
function showUpdateScreen(contentId) {
  editingContentId = contentId;
  const contents = window._userContents || [];
  const c = contents.find(x => x.entry_id === contentId);
  if (!c) return;

  const plat = PLATFORMS.find(p => p.id === c.platform_id);
  if (!plat) return;

  const metrics = c.latest_metrics || {};

  // Header
  document.getElementById('updateHeader').innerHTML = `
    <span class="update-icon">${plat.icon}</span>
    <div class="update-info">
      <h3>${plat.name} · ${c.content_type}</h3>
      <p>הועלה: ${formatDate(c.upload_date)}</p>
    </div>`;

  // Metrics fields
  const grid = document.getElementById('updateMetrics');
  const filteredMetrics = plat.metrics.filter(m => !m.onlyTypes || m.onlyTypes.includes(c.content_type));
  grid.innerHTML = '';
  filteredMetrics.forEach(m => {
    const val = metrics[m.id] || 0;
    grid.innerHTML += `<div class="metric-field">
      <label>${m.label} <span class="req">*</span></label>
      <input type="number" inputmode="numeric" data-metric="${m.id}" value="${val}" min="0" required>
    </div>`;
  });

  // Date
  document.getElementById('updateDate').value = today();

  showScreen('screenUpdate');
}

async function saveUpdate() {
  if (!editingContentId || !currentUser) return;

  const metricInputs = document.querySelectorAll('#updateMetrics input[data-metric]');

  // Validate all filled
  let allFilled = true;
  metricInputs.forEach(inp => {
    if (inp.value === '' || inp.value === null) allFilled = false;
  });
  if (!allFilled) { showToast('נא למלא את כל השדות'); return; }

  // Build metrics object
  const metrics = {};
  metricInputs.forEach(inp => {
    metrics[inp.dataset.metric] = parseInt(inp.value) || 0;
  });

  const btn = document.getElementById('btnSaveUpdate');
  btn.disabled = true;
  btn.textContent = 'שומר...';

  const db = CONFIG.db();
  const { error } = await db.rpc('update_metrics', {
    p_content_entry_id: editingContentId,
    p_profile_id: currentUser.profileId,
    p_snapshot_date: document.getElementById('updateDate').value,
    p_metrics: metrics
  });

  btn.disabled = false;
  btn.textContent = 'שמור עדכון';

  if (error) {
    showToast('שגיאה בשמירה — נסה שוב');
    console.error('Update error:', error);
    return;
  }

  document.getElementById('successTitle').textContent = 'הנתונים עודכנו בהצלחה!';
  document.getElementById('successMsg').textContent = 'הנתונים החדשים ישתקפו בדשבורד.';
  showScreen('screenSuccess');
  showToast('הנתונים עודכנו');
}

// =================== DELETE ===================
function showDeleteConfirm(contentId) {
  deletingContentId = contentId;
  const contents = window._userContents || [];
  const c = contents.find(x => x.entry_id === contentId);
  if (!c) return;
  const plat = PLATFORMS.find(p => p.id === c.platform_id);
  document.getElementById('confirmMsg').textContent = `בטוח שברצונך למחוק את ה${c.content_type} ב${plat.name}?`;
  document.getElementById('confirmOverlay').classList.add('show');
}

function hideConfirm() {
  document.getElementById('confirmOverlay').classList.remove('show');
  deletingContentId = null;
}

async function confirmDelete() {
  if (!deletingContentId || !currentUser) return;

  const db = CONFIG.db();
  const { error } = await db.rpc('delete_content_entry', {
    p_entry_id: deletingContentId,
    p_profile_id: currentUser.profileId
  });

  hideConfirm();

  if (error) {
    showToast('שגיאה במחיקה');
    console.error('Delete error:', error);
    return;
  }

  renderPersonalArea();
  showToast('התוכן נמחק');
}

// =================== TOAST ===================
let _toastTimer;
function showToast(msg) {
  clearTimeout(_toastTimer);
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  _toastTimer = setTimeout(() => t.classList.remove('show'), 3000);
}

// Init
init();
</script>
