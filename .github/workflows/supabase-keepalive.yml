name: Supabase keep-alive

# Supabase Free pauses projects after 7 days without activity.
# Ping the REST API twice a week to keep the production DB awake.
on:
  schedule:
    - cron: '0 6 * * 1,4'   # Mon + Thu, 06:00 UTC
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ping Supabase
        run: |
          URL=$(grep -oE "https://[a-z0-9]+\.supabase\.co" config.js | head -1)
          KEY=$(grep -oE "SUPABASE_ANON_KEY: '[^']+'" config.js | cut -d"'" -f2)
          CODE=$(curl -s -o /dev/null -w "%{http_code}" "$URL/rest/v1/campaigns?select=id&limit=1" \
            -H "apikey: $KEY" -H "Authorization: Bearer $KEY")
          echo "HTTP $CODE"
          [ "$CODE" = "200" ] || { echo "Supabase not responding (paused?)"; exit 1; }
