<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>קווים אדומים | ניהול ארגונים</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
--blue-50:#E6F1FB;--blue-100:#B5D4F4;--blue-200:#85B7EB;--blue-400:#378ADD;--blue-600:#185FA5;--blue-800:#0C447C;--blue-900:#042C53;
--teal-50:#E1F5EE;--teal-100:#9FE1CB;--teal-200:#5DCAA5;--teal-400:#1D9E75;--teal-600:#0F6E56;--teal-800:#085041;
--red-50:#FCEBEB;--red-400:#E24B4A;
--amber-50:#FFF8E1;--amber-400:#EF9F27;--amber-600:#854F0B;
--gray-50:#F8F9FA;--gray-100:#F1F3F5;--gray-200:#E9ECEF;--gray-300:#DEE2E6;--gray-400:#ADB5BD;--gray-500:#868E96;--gray-600:#495057;--gray-700:#343A40;--gray-800:#212529;
--radius:12px;--radius-sm:8px;
}
body{font-family:'Segoe UI',Tahoma,Arial,sans-serif;background:var(--gray-50);color:var(--gray-800);direction:rtl;min-height:100vh}
:focus-visible{outline:2px solid var(--blue-400);outline-offset:2px;border-radius:4px}

.topbar{background:#fff;border-bottom:1px solid var(--gray-200);padding:10px 24px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50}
.topbar-right{display:flex;align-items:center;gap:12px}
.topbar-logo{width:36px;height:36px;border-radius:50%;overflow:hidden;flex-shrink:0}
.topbar-logo img{width:100%;height:100%;object-fit:contain}
.topbar h1{font-size:18px;font-weight:600;color:var(--blue-900)}
.topbar-left{display:flex;align-items:center;gap:12px}
.admin-badge{background:var(--amber-50);color:var(--amber-600);font-size:11px;font-weight:600;padding:4px 12px;border-radius:20px;display:flex;align-items:center;gap:4px}

.main{max-width:600px;margin:0 auto;padding:28px 16px 60px}

.admin-nav{display:flex;gap:6px;margin-bottom:24px}
.nav-tab{padding:8px 18px;border-radius:20px;font-size:13px;font-weight:500;text-decoration:none;color:var(--gray-500);border:1.5px solid var(--gray-200);transition:all .2s;background:#fff}
.nav-tab:hover{border-color:var(--blue-200);color:var(--blue-600)}
.nav-tab.active{background:var(--blue-400);color:#fff;border-color:var(--blue-400)}

.page-header{margin-bottom:20px}
.page-header h2{font-size:22px;font-weight:700;color:var(--blue-900);margin-bottom:4px}
.page-header p{font-size:14px;color:var(--gray-500)}

.card{background:#fff;border-radius:var(--radius);border:1px solid var(--gray-200);padding:20px}

.org-tags{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.org-tag{display:flex;align-items:center;gap:8px;padding:8px 16px;border-radius:20px;background:var(--teal-50);color:var(--teal-800);font-size:14px;font-weight:500}
.org-tag .count{font-size:11px;background:var(--teal-200);color:var(--teal-800);padding:1px 7px;border-radius:10px}
.org-tag .remove-tag{border:none;background:none;color:var(--teal-400);cursor:pointer;font-size:16px;font-weight:700;padding:0 2px;line-height:1}
.org-tag .remove-tag:hover{color:var(--red-400)}
.org-tag.other{background:var(--gray-100);color:var(--gray-600)}

.add-row{display:flex;gap:8px;margin-top:16px;padding-top:16px;border-top:1px solid var(--gray-100)}
.add-row input{flex:1;padding:10px 14px;border:1.5px solid var(--gray-200);border-radius:var(--radius-sm);font-size:14px;font-family:inherit;background:#fff}
.add-row input:focus{outline:none;border-color:var(--blue-400);box-shadow:0 0 0 3px rgba(55,138,221,.12)}
.btn{padding:9px 18px;border:none;border-radius:var(--radius-sm);font-size:13px;font-weight:600;cursor:pointer;transition:all .2s;font-family:inherit}
.btn-primary{background:var(--blue-400);color:#fff}
.btn-primary:hover{background:var(--blue-600)}

.note{font-size:12px;color:var(--gray-400);margin-top:12px}

.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--gray-800);color:#fff;padding:10px 20px;border-radius:20px;font-size:13px;opacity:0;transition:all .4s;z-index:100;white-space:nowrap}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1}

.loading-overlay{position:fixed;inset:0;background:rgba(255,255,255,.85);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:200}
.loading-overlay.hidden{display:none}
.spinner{width:36px;height:36px;border:3px solid var(--gray-200);border-top-color:var(--blue-400);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-text{margin-top:12px;font-size:14px;color:var(--gray-500)}

@media(max-width:600px){
  .topbar{padding:8px 12px}
  .topbar h1{font-size:15px}
  .main{padding:16px 10px 40px}
  .admin-nav{gap:4px}
  .nav-tab{padding:6px 12px;font-size:12px}
  .page-header h2{font-size:18px}
  .org-tags{gap:6px}
  .org-tag{font-size:13px;padding:6px 12px}
}
</style>
</head>
<body>
<div class="loading-overlay" id="loadingOverlay" role="status" aria-label="טוען"><div class="spinner"></div><div class="loading-text">טוען...</div></div>

<div class="topbar" role="banner">
  <div class="topbar-right">
    <div class="topbar-logo"><img src="logo.jpg" alt="קווים אדומים"></div>
    <h1>קווים אדומים</h1>
  </div>
  <div class="topbar-left">
    <div class="admin-badge">⚙️ ממשק ניהול</div>
  </div>
</div>

<div class="main">
  <div class="admin-nav">
    <a class="nav-tab" href="admin-campaign.html">בניית קמפיין</a>
    <a class="nav-tab active" href="admin-pool.html">ניהול ארגונים</a>
    <a class="nav-tab" href="dashboard.html">דשבורד</a>
  </div>

  <div class="page-header">
    <h2>ניהול ארגונים</h2>
    <p>ארגונים מופיעים ברשימה בטופס ההרשמה. ניהול משתתפים נעשה מתוך הדשבורד.</p>
  </div>

  <div class="card">
    <div class="org-tags" id="orgTagsDisplay"></div>
    <div class="add-row">
      <input type="text" id="newOrgName" placeholder="שם ארגון חדש...">
      <button class="btn btn-primary" onclick="addOrg()">+ הוספה</button>
    </div>
    <div class="note">ארגון "אחר" מאפשר למשתתפים להזין שם ארגון חופשי בטופס ההרשמה.</div>
  </div>
</div>

<div class="toast" id="toast" role="alert" aria-live="assertive"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script>
let orgs = [];
let profileCounts = {}; // org_id → count of active profiles

function hideLoading() { const el = document.getElementById('loadingOverlay'); if (el) el.classList.add('hidden'); }

async function init() {
  const db = CONFIG.db();
  if (!db) { hideLoading(); showToast('שגיאה: Supabase לא מוגדר'); return; }

  try {
    const { data: orgRows } = await db.from('organizations').select('id, name').order('name');
    orgs = orgRows || [];

    // Count active profiles per org
    const { data: profiles } = await db.rpc('get_all_profiles');
    profileCounts = {};
    (profiles || []).filter(p => p.is_active).forEach(p => {
      profileCounts[p.org_id] = (profileCounts[p.org_id] || 0) + 1;
    });

    renderOrgs();
    hideLoading();
  } catch (e) {
    console.error('Init error:', e);
    showToast('שגיאה בטעינת נתונים');
    hideLoading();
  }
}

function renderOrgs() {
  const container = document.getElementById('orgTagsDisplay');
  container.innerHTML = orgs.map(o => {
    const count = profileCounts[o.id] || 0;
    const isOther = o.name === 'אחר';
    const cls = isOther ? 'org-tag other' : 'org-tag';
    const removeBtn = isOther ? '' : `<button class="remove-tag" onclick="removeOrg('${o.id}')" title="הסרה">×</button>`;
    return `<span class="${cls}">${o.name} <span class="count">${count}</span>${removeBtn}</span>`;
  }).join('');
}

async function addOrg() {
  const input = document.getElementById('newOrgName');
  const name = input.value.trim();
  if (!name) { showToast('יש להזין שם'); return; }
  if (orgs.some(o => o.name === name)) { showToast('ארגון זה כבר קיים'); return; }

  try {
    const db = CONFIG.db();
    const { data, error } = await db.from('organizations').insert({ name }).select('id, name').single();
    if (error) throw error;
    orgs.push(data);
    input.value = '';
    renderOrgs();
    showToast('הארגון "' + name + '" נוסף');
  } catch (e) {
    console.error('Add org error:', e);
    showToast('שגיאה בהוספת ארגון');
  }
}

async function removeOrg(orgId) {
  const orgObj = orgs.find(o => o.id === orgId);
  const count = profileCounts[orgId] || 0;
  if (count > 0) {
    showToast('לא ניתן להסיר ארגון עם ' + count + ' משתתפים');
    return;
  }

  try {
    const db = CONFIG.db();
    const { error } = await db.from('organizations').delete().eq('id', orgId);
    if (error) throw error;
    orgs = orgs.filter(o => o.id !== orgId);
    renderOrgs();
    showToast('הארגון "' + (orgObj ? orgObj.name : '') + '" הוסר');
  } catch (e) {
    console.error('Remove org error:', e);
    if (e.code === '23503') showToast('לא ניתן להסיר — יש משתתפים משויכים');
    else showToast('שגיאה בהסרת ארגון');
  }
}

let _toastTimer;
function showToast(msg) {
  clearTimeout(_toastTimer);
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  _toastTimer = setTimeout(() => t.classList.remove('show'), 2500);
}

document.getElementById('newOrgName').addEventListener('keydown', e => { if (e.key === 'Enter') addOrg(); });

init();
</script>
</body>
</html>
